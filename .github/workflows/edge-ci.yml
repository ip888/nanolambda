# =============================================================================
# NanoLambda Edge - CI/CD Pipeline
# =============================================================================
#
# Triggers:
# - Push to main branch (edge changes)
# - Pull requests to main (edge changes)
# - Manual workflow dispatch
#
# Jobs:
# 1. lint - Clippy and format checks
# 2. test - Unit tests
# 3. build - WASM build
# 4. deploy - Deploy to Cloudflare Workers
# =============================================================================

name: Edge CI/CD

on:
  push:
    branches: [main]
    paths:
      - "edge/**"
      - ".github/workflows/edge-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "edge/**"
      - ".github/workflows/edge-ci.yml"
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Deployment environment"
        required: false
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.93"

jobs:
  # ---------------------------------------------------------------------------
  # Lint Job - Code quality checks
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./edge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            edge/target
          key: ${{ runner.os }}-cargo-edge-lint-${{ hashFiles('edge/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-edge-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings

  # ---------------------------------------------------------------------------
  # Test Job - Unit tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./edge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            edge/target
          key: ${{ runner.os }}-cargo-edge-test-${{ hashFiles('edge/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-edge-test-

      - name: Run tests
        run: cargo test --lib

  # ---------------------------------------------------------------------------
  # Build Job - WASM build
  # ---------------------------------------------------------------------------
  build:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: ./edge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: edge/package-lock.json

      - name: Install wrangler
        run: npm install

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            edge/target
          key: ${{ runner.os }}-cargo-edge-build-${{ hashFiles('edge/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-edge-build-

      - name: Build WASM
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanolambda-edge-wasm
          path: |
            edge/build/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Deploy Job - Deploy to Cloudflare Workers
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: ${{ github.event.inputs.deploy_env || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: edge/package-lock.json

      - name: Install dependencies
        working-directory: ./edge
        run: npm install

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nanolambda-edge-wasm
          path: edge/build

      - name: Deploy to Cloudflare Workers
        id: deploy
        working-directory: ./edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ENV=${{ github.event.inputs.deploy_env || 'staging' }}
          if [ "$ENV" = "production" ]; then
            npx wrangler deploy --env production
            echo "url=https://edge.nanolambda.io" >> $GITHUB_OUTPUT
          else
            npx wrangler deploy --env staging
            echo "url=https://edge-staging.nanolambda.io" >> $GITHUB_OUTPUT
          fi

      - name: Notify deployment
        run: |
          echo "✅ Edge deployment complete!"
          echo "Environment: ${{ github.event.inputs.deploy_env || 'staging' }}"
          echo "URL: ${{ steps.deploy.outputs.url }}"
