<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoLambda Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            margin-bottom: 40px;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 20px;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 16px;
        }
        
        .last-update {
            float: right;
            color: #64748b;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .time-windows {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .time-window {
            padding: 8px 16px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        
        .time-window:hover {
            background: #334155;
        }
        
        .time-window.active {
            background: #3b82f6;
            border-color: #3b82f6;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
        }
        
        .metric-label {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .metric-value {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
        }
        
        .metric-unit {
            font-size: 18px;
            color: #64748b;
            margin-left: 4px;
        }
        
        .metric-secondary {
            font-size: 14px;
            color: #64748b;
            margin-top: 8px;
        }
        
        .status-good { color: #10b981; }
        .status-warning { color: #f59e0b; }
        .status-error { color: #ef4444; }
        
        .latency-breakdown {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .latency-breakdown h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-container {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            height: 300px;
        }
        
        .chart-container h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #fff;
        }
        
        .chart-wrapper {
            position: relative;
            height: 240px;
        }
        
        .percentile-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .percentile-label {
            width: 60px;
            font-size: 14px;
            color: #94a3b8;
        }
        
        .percentile-bar {
            flex: 1;
            height: 24px;
            background: #0f172a;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        
        .percentile-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            transition: width 0.3s;
        }
        
        .percentile-value {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }
        
        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 18px;
        }
        
        .refresh-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
            margin-left: 8px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* Responsive Design - Mobile First */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .subtitle {
                font-size: 14px;
            }
            
            .last-update {
                float: none;
                margin-top: 10px;
                font-size: 12px;
            }
            
            .time-windows {
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .time-window {
                padding: 6px 12px;
                font-size: 14px;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .charts-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .chart-container {
                height: auto;
                min-height: 280px;
            }
            
            .chart-wrapper {
                height: 220px;
            }
            
            .metric-value {
                font-size: 28px;
            }
        }
        
        @media (min-width: 769px) and (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (min-width: 1025px) {
            .charts-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ NanoLambda Dashboard</h1>
            <p class="subtitle">Real-time serverless function metrics</p>
            <div class="last-update">
                Last updated: <span id="lastUpdate">--</span>
                <span class="refresh-indicator"></span>
            </div>
        </header>
        
        <div class="time-windows">
            <button class="time-window active" data-window="last_hour">Last Hour</button>
            <button class="time-window" data-window="last_24h">Last 24 Hours</button>
            <button class="time-window" data-window="all_time">All Time</button>
        </div>
        
        <!-- API Key Input for Usage Tracking -->
        <div class="api-key-section" style="margin: 20px 0; padding: 15px; background: #1e293b; border-radius: 8px; border: 1px solid #334155;">
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <label style="color: #94a3b8; font-size: 14px;">🔑 API Key (optional):</label>
                <input type="text" id="apiKeyInput" placeholder="nl_..." autocomplete="off"
                    style="flex: 1; min-width: 300px; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; font-family: 'Courier New', monospace; font-size: 13px;">
                <button id="toggleApiKeyBtn" onclick="toggleApiKeyVisibility()" 
                    style="padding: 8px 12px; background: #334155; color: #94a3b8; border: none; border-radius: 4px; cursor: pointer;" title="Toggle visibility">
                    👁️
                </button>
                <button id="loadUsageBtn" onclick="fetchUsageData()" 
                    style="padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500;">
                    Load Usage & Billing
                </button>
                <button id="clearApiKeyBtn" onclick="clearApiKey()" 
                    style="padding: 8px 16px; background: #64748b; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Clear
                </button>
            </div>
            <div id="usageError" style="margin-top: 8px; color: #ef4444; font-size: 13px; display: none;"></div>
        </div>
        
        <!-- Usage & Billing Section -->
        <div id="usageSection" style="display: none; margin-bottom: 30px;">
            <h2 style="color: #e2e8f0; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
                💳 Usage & Billing
            </h2>
            <div id="usageContent"></div>
        </div>
        
        <div id="dashboard-content">
            <div class="no-data">Loading metrics...</div>
        </div>
    </div>
    
    <script>
        let currentWindow = 'last_hour';
        let charts = {};
        
        // Initialize charts
        function initCharts() {
            const chartOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: { color: '#e2e8f0' }
                    }
                },
                scales: {
                    x: { 
                        ticks: { color: '#94a3b8' },
                        grid: { color: '#334155' }
                    },
                    y: { 
                        ticks: { color: '#94a3b8' },
                        grid: { color: '#334155' }
                    }
                }
            };
            
            // Invocations timeline (line chart)
            charts.invocations = new Chart(
                document.getElementById('invocationsChart'),
                {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'Invocations',
                            data: [],
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: chartOptions
                }
            );
            
            // Latency percentiles (bar chart)
            charts.latency = new Chart(
                document.getElementById('latencyChart'),
                {
                    type: 'bar',
                    data: {
                        labels: ['P50', 'P95', 'P99', 'Average'],
                        datasets: [{
                            label: 'Latency (ms)',
                            data: [0, 0, 0, 0],
                            backgroundColor: [
                                'rgba(16, 185, 129, 0.8)',
                                'rgba(245, 158, 11, 0.8)',
                                'rgba(239, 68, 68, 0.8)',
                                'rgba(59, 130, 246, 0.8)'
                            ],
                            borderColor: [
                                '#10b981',
                                '#f59e0b',
                                '#ef4444',
                                '#3b82f6'
                            ],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        ...chartOptions,
                        plugins: {
                            legend: { display: false }
                        }
                    }
                }
            );
            
            // Status distribution (doughnut chart)
            charts.status = new Chart(
                document.getElementById('statusChart'),
                {
                    type: 'doughnut',
                    data: {
                        labels: ['Success', 'Errors', 'Timeouts'],
                        datasets: [{
                            data: [0, 0, 0],
                            backgroundColor: [
                                'rgba(16, 185, 129, 0.8)',
                                'rgba(239, 68, 68, 0.8)',
                                'rgba(245, 158, 11, 0.8)'
                            ],
                            borderColor: [
                                '#10b981',
                                '#ef4444',
                                '#f59e0b'
                            ],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { color: '#e2e8f0' }
                            }
                        }
                    }
                }
            );
            
            // Cold start percentage (doughnut gauge)
            charts.coldStart = new Chart(
                document.getElementById('coldStartChart'),
                {
                    type: 'doughnut',
                    data: {
                        labels: ['Cold Starts', 'Warm Starts'],
                        datasets: [{
                            data: [0, 100],
                            backgroundColor: [
                                'rgba(139, 92, 246, 0.8)',
                                'rgba(51, 65, 85, 0.3)'
                            ],
                            borderColor: [
                                '#8b5cf6',
                                '#334155'
                            ],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        circumference: 180,
                        rotation: -90,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { color: '#e2e8f0' }
                            }
                        }
                    }
                }
            );
        }
        
        function updateCharts(metrics) {
            // Update invocations timeline (show last 20 data points)
            const invocationsData = generateTimelineData(metrics);
            charts.invocations.data.labels = invocationsData.labels;
            charts.invocations.data.datasets[0].data = invocationsData.values;
            charts.invocations.update();
            
            // Update latency chart
            charts.latency.data.datasets[0].data = [
                metrics.p50_latency_ms || 0,
                metrics.p95_latency_ms || 0,
                metrics.p99_latency_ms || 0,
                metrics.avg_latency_ms || 0
            ];
            charts.latency.update();
            
            // Update status distribution
            const successCount = metrics.total_invocations - metrics.errors - metrics.timeouts;
            charts.status.data.datasets[0].data = [
                successCount,
                metrics.errors || 0,
                metrics.timeouts || 0
            ];
            charts.status.update();
            
            // Update cold start gauge
            const coldStartRate = metrics.cold_start_rate || 0;
            charts.coldStart.data.datasets[0].data = [
                coldStartRate * 100,
                (1 - coldStartRate) * 100
            ];
            charts.coldStart.update();
        }
        
        function generateTimelineData(metrics) {
            // Generate sample timeline data (in production, this would come from time-series data)
            const points = 20;
            const labels = [];
            const values = [];
            const now = Date.now();
            const interval = currentWindow === 'last_hour' ? 3 * 60 * 1000 : 
                           currentWindow === 'last_24h' ? 72 * 60 * 1000 : 
                           24 * 60 * 60 * 1000;
            
            for (let i = points - 1; i >= 0; i--) {
                const time = new Date(now - (i * interval));
                labels.push(time.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                }));
                // Approximate distribution (in production, use actual time-series data)
                values.push(Math.max(0, Math.floor(metrics.total_invocations / points + (Math.random() - 0.5) * 10)));
            }
            
            return { labels, values };
        }

        
        // Fetch and display metrics
        async function fetchMetrics() {
            try {
                const response = await fetch('/metrics');
                const data = await response.json();
                
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
                renderMetrics(data[currentWindow]);
            } catch (error) {
                console.error('Failed to fetch metrics:', error);
                document.getElementById('dashboard-content').innerHTML = 
                    '<div class="no-data">Failed to load metrics. Is the server running?</div>';
            }
        }
        
        // Render metrics UI
        function renderMetrics(metrics) {
            if (metrics.total_invocations === 0) {
                document.getElementById('dashboard-content').innerHTML = 
                    '<div class="no-data">No invocations yet. Create and invoke a function to see metrics!</div>';
                return;
            }
            
            const html = `
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">Total Invocations</div>
                        <div class="metric-value">${metrics.total_invocations.toLocaleString()}</div>
                        <div class="metric-secondary">
                            ${metrics.invocations_per_second.toFixed(2)} invocations/sec
                        </div>
                    </div>
                    
                    <div class="metric-card">
                        <div class="metric-label">Average Latency</div>
                        <div class="metric-value">
                            ${metrics.avg_latency_ms.toFixed(1)}
                            <span class="metric-unit">ms</span>
                        </div>
                        <div class="metric-secondary ${getLatencyClass(metrics.avg_latency_ms)}">
                            ${getLatencyText(metrics.avg_latency_ms)}
                        </div>
                    </div>
                    
                    <div class="metric-card">
                        <div class="metric-label">Cold Starts</div>
                        <div class="metric-value">
                            ${metrics.cold_starts}
                            <span class="metric-unit">(${(metrics.cold_start_rate * 100).toFixed(1)}%)</span>
                        </div>
                        <div class="metric-secondary ${getColdStartClass(metrics.cold_start_rate)}">
                            ${getColdStartText(metrics.cold_start_rate)}
                        </div>
                    </div>
                    
                    <div class="metric-card">
                        <div class="metric-label">Error Rate</div>
                        <div class="metric-value ${getErrorClass(metrics.error_rate)}">
                            ${(metrics.error_rate * 100).toFixed(1)}
                            <span class="metric-unit">%</span>
                        </div>
                        <div class="metric-secondary">
                            ${metrics.errors} errors / ${metrics.timeouts} timeouts
                        </div>
                    </div>
                </div>
                
                <div class="charts-grid">
                    <div class="chart-container">
                        <h2>📈 Invocations Over Time</h2>
                        <div class="chart-wrapper">
                            <canvas id="invocationsChart"></canvas>
                        </div>
                    </div>
                    
                    <div class="chart-container">
                        <h2>⚡ Latency Distribution</h2>
                        <div class="chart-wrapper">
                            <canvas id="latencyChart"></canvas>
                        </div>
                    </div>
                    
                    <div class="chart-container">
                        <h2>🎯 Success vs Errors</h2>
                        <div class="chart-wrapper">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                    
                    <div class="chart-container">
                        <h2>🔥 Cold Start Rate</h2>
                        <div class="chart-wrapper">
                            <canvas id="coldStartChart"></canvas>
                        </div>
                    </div>
                </div>
                
                <div class="latency-breakdown">
                    <h2>📊 Latency Distribution</h2>
                    
                    <div class="percentile-row">
                        <div class="percentile-label">P50</div>
                        <div class="percentile-bar">
                            <div class="percentile-fill" style="width: ${getPercentileWidth(metrics.p50_latency_ms, metrics.p99_latency_ms)}%"></div>
                            <div class="percentile-value">${metrics.p50_latency_ms}ms</div>
                        </div>
                    </div>
                    
                    <div class="percentile-row">
                        <div class="percentile-label">P95</div>
                        <div class="percentile-bar">
                            <div class="percentile-fill" style="width: ${getPercentileWidth(metrics.p95_latency_ms, metrics.p99_latency_ms)}%"></div>
                            <div class="percentile-value">${metrics.p95_latency_ms}ms</div>
                        </div>
                    </div>
                    
                    <div class="percentile-row">
                        <div class="percentile-label">P99</div>
                        <div class="percentile-bar">
                            <div class="percentile-fill" style="width: 100%"></div>
                            <div class="percentile-value">${metrics.p99_latency_ms}ms</div>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('dashboard-content').innerHTML = html;
            
            // Always reinitialize charts after innerHTML (canvas elements are destroyed)
            initCharts();
            
            // Update charts with new data
            updateCharts(metrics);
        }
        
        // Helper functions
        function getLatencyClass(latency) {
            if (latency < 100) return 'status-good';
            if (latency < 500) return 'status-warning';
            return 'status-error';
        }
        
        function getLatencyText(latency) {
            if (latency < 100) return '⚡ Excellent';
            if (latency < 500) return '⚠️ Acceptable';
            return '❌ Slow';
        }
        
        function getColdStartClass(rate) {
            if (rate < 0.1) return 'status-good';
            if (rate < 0.5) return 'status-warning';
            return 'status-error';
        }
        
        function getColdStartText(rate) {
            if (rate < 0.1) return '✅ Very low';
            if (rate < 0.5) return '⚠️ Moderate';
            return '❌ High';
        }
        
        function getErrorClass(rate) {
            if (rate < 0.01) return 'status-good';
            if (rate < 0.05) return 'status-warning';
            return 'status-error';
        }
        
        function getPercentileWidth(value, max) {
            if (max === 0) return 0;
            return Math.min(100, (value / max) * 100);
        }
        
        // Usage & Billing Functions
        async function fetchUsageData() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const errorEl = document.getElementById('usageError');
            const usageSection = document.getElementById('usageSection');
            const usageContent = document.getElementById('usageContent');
            
            if (!apiKey) {
                errorEl.textContent = 'Please enter an API key';
                errorEl.style.display = 'block';
                return;
            }
            
            errorEl.style.display = 'none';
            usageContent.innerHTML = '<div style="padding: 20px; text-align: center; color: #94a3b8;">Loading...</div>';
            usageSection.style.display = 'block';
            
            try {
                // Fetch usage stats, billing info, rate limit status, tier info, pricing, and invoices in parallel
                const [usageRes, billingRes, rateLimitRes, tierRes, pricingRes, invoiceSummary] = await Promise.all([
                    fetch('/usage/stats', {
                        headers: { 'Authorization': `Bearer ${apiKey}` }
                    }),
                    fetch('/usage/billing', {
                        headers: { 'Authorization': `Bearer ${apiKey}` }
                    }),
                    fetch('/rate-limit/status', {
                        headers: { 'Authorization': `Bearer ${apiKey}` }
                    }),
                    fetch('/tier/current', {
                        headers: { 'Authorization': `Bearer ${apiKey}` }
                    }),
                    fetch('/pricing'),
                    fetchInvoiceSummary()
                ]);
                
                if (!usageRes.ok || !billingRes.ok || !rateLimitRes.ok) {
                    throw new Error('Invalid API key or unauthorized');
                }
                
                const usage = await usageRes.json();
                const billing = await billingRes.json();
                const rateLimit = await rateLimitRes.json();
                const tierInfo = tierRes.ok ? await tierRes.json() : null;
                const pricing = pricingRes.ok ? await pricingRes.json() : null;
                
                // Fetch upgrade recommendation
                const recommendation = await fetchUpgradeRecommendation(apiKey);
                
                renderUsageData(usage, billing, rateLimit, tierInfo, pricing, recommendation, invoiceSummary);
                
                // Store API key for future use
                sessionStorage.setItem('nanolambda_api_key', apiKey);
            } catch (error) {
                errorEl.textContent = `Error: ${error.message}`;
                errorEl.style.display = 'block';
                usageSection.style.display = 'none';
            }
        }
        
        // Fetch upgrade recommendation
        async function fetchUpgradeRecommendation(apiKey) {
            try {
                const response = await fetch('/tier/recommendation', {
                    headers: { 'Authorization': `Bearer ${apiKey}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    return data.has_recommendation ? data.recommendation : null;
                }
            } catch (error) {
                console.error('Failed to fetch upgrade recommendation:', error);
            }
            return null;
        }
        
        // Render upgrade banner based on recommendation
        function renderUpgradeBanner(recommendation) {
            if (!recommendation) return '';
            
            const urgencyColor = recommendation.urgency >= 80 ? '#ef4444' : recommendation.urgency >= 60 ? '#f97316' : '#3b82f6';
            const urgencyLabel = recommendation.urgency >= 80 ? 'URGENT' : recommendation.urgency >= 60 ? 'RECOMMENDED' : 'SUGGESTED';
            
            return `
                <div style="background: linear-gradient(135deg, ${urgencyColor} 0%, ${urgencyColor}dd 100%); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <div style="display: flex; align-items: start; justify-content: space-between; gap: 15px;">
                        <div style="flex: 1;">
                            <div style="font-size: 12px; font-weight: 700; letter-spacing: 1px; opacity: 0.9; margin-bottom: 8px;">
                                ${urgencyLabel} UPGRADE
                            </div>
                            <div style="font-size: 20px; font-weight: 700; margin-bottom: 10px;">
                                Upgrade to ${recommendation.recommended_tier.toUpperCase()}
                            </div>
                            <div style="opacity: 0.95; margin-bottom: 15px;">

        function clearApiKey() {

            btn.textContent = '👁️';
            document.getElementById('usageSection').style.display = 'none';
            document.getElementById('usageError').style.display = 'none';
            sessionStorage.removeItem('nanolambda_api_key');
            input.focus();
        }
        
        function toggleApiKeyVisibility() {
            const input = document.getElementById('apiKeyInput');
            const btn = document.getElementById('toggleApiKeyBtn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }
        
        // Load API key from session storage if available
        window.addEventListener('DOMContentLoaded', () => {
            const savedApiKey = sessionStorage.getItem('nanolambda_api_key');
            if (savedApiKey) {
                document.getElementById('apiKeyInput').value = savedApiKey;
                fetchUsageData();
            }
            
            // Also check URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const apiKeyParam = urlParams.get('apiKey');
            if (apiKeyParam) {
                document.getElementById('apiKeyInput').value = apiKeyParam;
                fetchUsageData();
            }
        });
        
        // Time window switching
        document.querySelectorAll('.time-window').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.time-window').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentWindow = btn.dataset.window;
                fetchMetrics();
            });
        });
        
        // Check for usage alerts
        async function checkUsageAlerts() {
            const apiKey = document.getElementById('apiKeyInput').value;
            if (!apiKey) return null;
            
            try {
                const response = await fetch('/usage/alerts', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    return data.alerts || [];
                }
            } catch (error) {
                console.error('Failed to fetch alerts:', error);
            }
            
            return [];
        }
        
        // Get alert badge HTML based on usage percentage
        function getAlertBadge(percent) {
            if (percent >= 100) {
                return '<div style="background: #dc2626; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-top: 8px; display: inline-block;">🚨 LIMIT REACHED</div>';
            } else if (percent >= 90) {
                return '<div style="background: #ea580c; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-top: 8px; display: inline-block;">⚠️ 90% USED</div>';
            } else if (percent >= 80) {
                return '<div style="background: #f59e0b; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-top: 8px; display: inline-block;">⚡ 80% USED</div>';
            }
            return '';
        }
        
        // Open Customer Portal
        async function openCustomerPortal() {
            const apiKey = document.getElementById('apiKeyInput').value;
            
            if (!apiKey) {
                alert('Please enter your API key first');
                return;
            }
            
            try {
                const response = await fetch('/payment/portal', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        return_url: window.location.href
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Failed to create portal session');
                }
                
                const data = await response.json();
                if (data.success && data.portal_url) {
                    // Open portal in new tab
                    window.open(data.portal_url, '_blank');
                } else {
                    throw new Error('Invalid portal response');
                }
            } catch (error) {
                console.error('Failed to open portal:', error);
                alert(`Failed to open billing portal: ${error.message}\n\nMake sure you have an active subscription and payment method.`);
            }
        }

            const apiKey = document.getElementById('apiKeyInput').value;
            
            try {
                // First, check if payment method is set up
                // If not, redirect to customer portal for payment setup
                const response = await fetch('/payment/customer', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`
                    }
                });
                
                if (!response.ok || !(await response.json()).payment_method_id) {
                    // No payment method - redirect to portal
                    alert('Please set up a payment method first');
                    closeUpgradeModal();
                    openCustomerPortal();
                    return;
                }
                
                // Perform upgrade
                const upgradeResponse = await fetch('/tier/upgrade', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({ tier: targetTier })
                });
                
                if (upgradeResponse.ok) {
                    const result = await upgradeResponse.json();
                    closeUpgradeModal();
                    alert(`✅ ${result.message}\n\nYour dashboard will refresh automatically.`);
                    
                    // Refresh data
                    setTimeout(() => {
                        fetchUsageData();
                    }, 1000);
                } else {
                    const error = await upgradeResponse.json();
                    throw new Error(error.message || 'Upgrade failed');
                }

            try {

                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code, amount })
                });
                
                if (!response.ok) {
                    throw new Error('Validation request failed');
                }
                
                return await response.json();
            } catch (error) {
                console.error('Failed to validate discount code:', error);
                return { valid: false, error_message: 'Failed to validate code' };
            }
        }

            const apiKey = document.getElementById('apiKeyInput').value;
            
            if (!apiKey) {
                alert('Please enter your API key first');
                return null;
            }
            
            try {
                const response = await fetch('/discounts/apply', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({ code, amount })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to apply discount');
                }
                
                return await response.json();
            } catch (error) {
                console.error('Failed to apply discount code:', error);
                alert(`❌ ${error.message}`);
                return null;

        async function validateAndShowDiscount() {
            const codeInput = document.getElementById('discount-code-input');
            const code = codeInput.value.trim().toUpperCase();
            const resultDiv = document.getElementById('discount-result');
            
            if (!code) {
                alert('Please enter a discount code');
                return;
            }
            
            // Assume checking against a $50 subscription (5000 cents)
            const testAmount = 5000; // $50 in cents
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div style="padding: 12px; background: #f1f5f9; border-radius: 8px; text-align: center;">Validating...</div>';
            
            const validation = await validateDiscountCode(code, testAmount);
            
            if (validation.valid) {
                const discount = validation.calculated_discount;
                const originalPrice = testAmount / 100;
                const discountedPrice = (testAmount - discount) / 100;
                const discountPercent = Math.round((discount / testAmount) * 100);
                
                resultDiv.innerHTML = `
                    <div style="padding: 16px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); border-radius: 8px; color: white;">

                            </div>
                            <div style="text-align: right;">
                                <div style="font-size: 12px; opacity: 0.9; text-decoration: line-through;">$${originalPrice.toFixed(2)}</div>
                                <div style="font-size: 28px; font-weight: 700;">$${discountedPrice.toFixed(2)}</div>
                            </div>
                        </div>

            const shareUrl = `${window.location.origin}/referrals/${code}`;

            let url = '';
            switch (platform) {
                case 'email':
                    url = `mailto:?subject=Check out NanoLambda&body=${encodeURIComponent(message + '\n\n' + shareUrl)}`;
                    break;
                case 'twitter':
                    url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(message)}&url=${encodeURIComponent(shareUrl)}`;
                    break;
                case 'linkedin':
                    url = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}`;

                                                <div style="color: white; font-size: 24px; font-weight: 700;">${summary.total_customers}</div>
                                            </div>
                                            <div style="background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px;">
                                                <div style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">Avg CLV</div>
                                                <div style="color: white; font-size: 24px; font-weight: 700;">${formatMoney(summary.avg_clv)}</div>
                                            </div>
                                            <div style="background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px;">
                                                <div style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">High Value</div>
                                                <div style="color: white; font-size: 24px; font-weight: 700;">${summary.high_value_customers}</div>
                                            </div>
                                            <div style="background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px;">
                                                <div style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">At Risk</div>
                                                <div style="color: #ef4444; font-size: 24px; font-weight: 700;">${summary.at_risk_high_value}</div>
                                            </div>
                                        </div>
                                        <div style="background: rgba(255,255,255,0.03); padding: 16px; border-radius: 8px;">
                                            <div style="color: #94a3b8; font-size: 13px; margin-bottom: 12px; font-weight: 600;">Segment Breakdown:</div>
                                            ${summary.clv_segments.map(segment => `
                                                <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">
                                                    <div style="display: flex; align-items: center; gap: 12px;">
                                                        <div style="width: 12px; height: 12px; background: ${segmentColors[segment.segment_name] || '#6b7280'}; border-radius: 50%;"></div>
                                                        <span style="color: white; font-weight: 600; text-transform: uppercase;">${segment.segment_name}</span>
                                                    </div>
                                                    <div style="text-align: right;">
                                                        <div style="color: white; font-weight: 600;">${segment.customer_count} customers</div>
                                                        <div style="color: #64748b; font-size: 12px;">Avg: ${formatMoney(segment.avg_clv)}</div>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}

                                <div style="margin-top: 24px; display: flex; justify-content: flex-end;">
                                    <button onclick="closeCLVDialog()" style="padding: 10px 20px; background: #334155; color: #e2e8f0; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Close</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHtml);
            } catch (error) {
                console.error('Error showing CLV:', error);
                alert('Failed to load CLV data');
            }
        }

        function closeCLVDialog() {
            document.getElementById('clv-modal')?.remove();
        }

        // Show Churn Risk Dialog
        async function showChurnDialog() {
            const apiKey = document.getElementById('apiKeyInput').value || localStorage.getItem('nanolambda_api_key');
            if (!apiKey) {
                alert('Please enter API key first');
                return;
            }

            try {
                // Fetch churn risk and platform metrics
                const [riskResponse, metricsResponse] = await Promise.all([
                    fetch('/churn/risk', {
                        headers: { 'x-api-key': apiKey }
                    }),
                    fetch('/churn/metrics')
                ]);

                const riskData = await riskResponse.json();
                const metricsData = await metricsResponse.json();

                const risk = riskData.data;
                const metrics = metricsData.data;

                const hasRisk = risk && !risk.message;

                // Risk level colors
                const riskColors = {
                    'critical': '#dc2626',
                    'high': '#f59e0b',
                    'medium': '#eab308',
                    'low': '#10b981'
                };

                const modalHtml = `
                    <div id="churn-modal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px;">
                        <div style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 12px; max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);">
                            <div style="padding: 32px;">
                                <div style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); padding: 24px; border-radius: 12px; margin: -32px -32px 24px -32px;">
                                    <h2 style="margin: 0; color: white; font-size: 28px; display: flex; align-items: center; justify-content: space-between;">
                                        ⚠️ Churn Risk Analysis
                                        <button onclick="closeChurnDialog()" style="background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; font-size: 20px;">×</button>
                                    </h2>
                                </div>

                                ${hasRisk ? `
                                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
                                        <div style="background: #0f172a; padding: 20px; border-radius: 12px; border: 2px solid ${riskColors[risk.risk_level]};">
                                            <div style="color: #94a3b8; font-size: 13px; margin-bottom: 8px;">Risk Score</div>
                                            <div style="color: ${riskColors[risk.risk_level]}; font-size: 42px; font-weight: 700; margin-bottom: 4px;">${risk.risk_score.toFixed(0)}</div>
                                            <div style="display: inline-block; padding: 4px 12px; background: ${riskColors[risk.risk_level]}; color: white; border-radius: 12px; font-weight: 600; text-transform: uppercase; font-size: 11px;">
                                                ${risk.risk_level}
                                            </div>
                                        </div>
                                        
                                        <div style="background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #334155;">
                                            <div style="color: #94a3b8; font-size: 13px; margin-bottom: 8px;">Churn Probability</div>
                                            <div style="color: white; font-size: 32px; font-weight: 700; margin-bottom: 4px;">${(risk.likelihood_to_churn * 100).toFixed(0)}%</div>
                                            <div style="color: #64748b; font-size: 12px;">Likelihood to churn</div>
                                        </div>
                                        
                                        <div style="background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #334155;">
                                            <div style="color: #94a3b8; font-size: 13px; margin-bottom: 8px;">Value at Risk</div>
                                            <div style="color: white; font-size: 32px; font-weight: 700; margin-bottom: 4px;">$${(risk.estimated_value_at_risk / 100).toLocaleString()}</div>
                                            <div style="color: #64748b; font-size: 12px;">Potential LTV loss</div>
                                        </div>
                                        
                                        <div style="background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #334155;">
                                            <div style="color: #94a3b8; font-size: 13px; margin-bottom: 8px;">Time to Churn</div>
                                            <div style="color: white; font-size: 32px; font-weight: 700; margin-bottom: 4px;">${risk.days_until_predicted_churn || 'N/A'}</div>
                                            <div style="color: #64748b; font-size: 12px;">${risk.days_until_predicted_churn ? 'Days predicted' : 'Low risk'}</div>
                                        </div>
                                    </div>

                                    ${risk.primary_risk_factors && risk.primary_risk_factors.length > 0 ? `
                                        <div style="background: #0f172a; padding: 24px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 24px;">
                                            <h3 style="color: white; font-size: 18px; margin: 0 0 16px 0;">🎯 Risk Factors</h3>
                                            ${risk.primary_risk_factors.map(factor => `
                                                <div style="background: rgba(255,255,255,0.03); padding: 16px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid ${riskColors[factor.severity]};">
                                                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px;">
                                                        <div>
                                                            <div style="color: white; font-weight: 600; font-size: 15px; margin-bottom: 4px;">${factor.factor.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</div>
                                                            <div style="color: #94a3b8; font-size: 13px;">${factor.description}</div>
                                                        </div>
                                                        <div style="text-align: right;">
                                                            <div style="color: ${riskColors[factor.severity]}; font-weight: 700; font-size: 18px;">${factor.impact_score.toFixed(0)}</div>
                                                            <div style="color: #64748b; font-size: 11px; text-transform: uppercase;">${factor.severity}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    ` : ''}

                                    ${risk.intervention_recommendations && risk.intervention_recommendations.length > 0 ? `
                                        <div style="background: #0f172a; padding: 24px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 24px;">
                                            <h3 style="color: white; font-size: 18px; margin: 0 0 16px 0;">💡 Recommended Interventions</h3>
                                            ${risk.intervention_recommendations.slice(0, 5).map((intervention, idx) => {
                                                const priorityColors = {
                                                    'urgent': '#dc2626',
                                                    'high': '#f59e0b',
                                                    'medium': '#3b82f6',
                                                    'low': '#6b7280'
                                                };
                                                return `
                                                    <div style="background: rgba(255,255,255,0.03); padding: 16px; border-radius: 8px; margin-bottom: 12px;">
                                                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px;">
                                                            <div style="flex: 1;">
                                                                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                                                                    <span style="color: white; font-weight: 600; font-size: 14px;">${idx + 1}. ${intervention.action}</span>
                                                                    <span style="padding: 2px 8px; background: ${priorityColors[intervention.priority]}; color: white; border-radius: 8px; font-size: 10px; font-weight: 600; text-transform: uppercase;">
                                                                        ${intervention.priority}
                                                                    </span>
                                                                </div>
                                                                <div style="color: #94a3b8; font-size: 12px; margin-bottom: 8px;">
                                                                    Owner: ${intervention.owner} • Timeline: ${intervention.timeline}
                                                                </div>
                                                                <div style="display: flex; gap: 16px;">
                                                                    <span style="color: #64748b; font-size: 12px;">Cost: $${(intervention.estimated_cost / 100).toFixed(0)}</span>
                                                                    <span style="color: #10b981; font-size: 12px;">Success Rate: ${(intervention.expected_success_rate * 100).toFixed(0)}%</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    ` : ''}
                                ` : `
                                    <div style="background: #0f172a; padding: 32px; border-radius: 12px; border: 1px solid #334155; text-align: center; margin-bottom: 24px;">
                                        <div style="font-size: 48px; margin-bottom: 16px;">📊</div>
                                        <div style="color: white; font-size: 20px; font-weight: 600; margin-bottom: 8px;">No Churn Analysis Yet</div>
                                        <div style="color: #94a3b8; font-size: 14px; margin-bottom: 16px;">Use POST /churn/analyze to calculate churn risk</div>
                                        <div style="color: #64748b; font-size: 13px; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 6px;">
                                            Required: usage_declining, payment_issues, support_tickets, last_login_days_ago, feature_adoption_score, nps_score, predicted_ltv
                                        </div>
                                    </div>
                                `}

                                ${metrics ? `
                                    <div style="background: #0f172a; padding: 24px; border-radius: 12px; border: 1px solid #334155;">
                                        <h3 style="color: white; font-size: 18px; margin: 0 0 16px 0;">📊 Platform Churn Metrics</h3>
                                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">
                                            <div style="background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px;">
                                                <div style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">Total Customers</div>
                                                <div style="color: white; font-size: 24px; font-weight: 700;">${metrics.total_customers}</div>
                                            </div>
                                            <div style="background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px;">
                                                <div style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">At Risk</div>
                                                <div style="color: #ef4444; font-size: 24px; font-weight: 700;">${metrics.at_risk_count}</div>
                                            </div>
                                            <div style="background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px;">
                                                <div style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">30-Day Churn Rate</div>
                                                <div style="color: white; font-size: 24px; font-weight: 700;">${metrics.churn_rate_30d.toFixed(1)}%</div>
                                            </div>
                                            <div style="background: rgba(255,255,255,0.05); padding: 16px; border-radius: 8px;">
                                                <div style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">Value at Risk</div>
                                                <div style="color: white; font-size: 24px; font-weight: 700;">$${(metrics.total_value_at_risk / 100).toLocaleString()}</div>
                                            </div>
                                        </div>
                                    </div>
                                ` : ''}

                                <div style="margin-top: 24px; display: flex; justify-content: flex-end;">
                                    <button onclick="closeChurnDialog()" style="padding: 10px 20px; background: #334155; color: #e2e8f0; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Close</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHtml);
            } catch (error) {
                console.error('Error showing churn risk:', error);
                alert('Failed to load churn risk data');
            }
        }

        function closeChurnDialog() {
            document.getElementById('churn-modal')?.remove();
        }

        // Auto-refresh every 5 seconds
        fetchMetrics();
        setInterval(fetchMetrics, 5000);
    </script>
</body>
</html>
