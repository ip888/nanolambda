[package]
name = "nanolambda"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
description = "Self-hosted serverless platform with microVM isolation"
repository = "https://github.com/yourusername/nanolambda"
keywords = ["serverless", "lambda", "kvm", "microvm", "functions"]
categories = ["virtualization", "web-programming"]

[workspace]
members = [
    "crates/vmm",
    "crates/api-server",
    "crates/runtime",
    "crates/scheduler",
    "crates/storage",
]

[[bin]]
name = "nanolambda-server"
path = "src/bin/server.rs"

[[bin]]
name = "nanolambda-cli"
path = "src/bin/cli.rs"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP server
actix-web = "4.8"
actix-rt = "2.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Storage
sled = "0.34"

# Cryptography
sha2 = "0.10"
base64 = "0.22"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Workspace crates
nanolambda-vmm = { path = "crates/vmm" }
nanolambda-api = { path = "crates/api-server" }
nanolambda-runtime = { path = "crates/runtime" }
nanolambda-scheduler = { path = "crates/scheduler" }
nanolambda-storage = { path = "crates/storage" }

[dev-dependencies]
tempfile = "3.12"
mockall = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
