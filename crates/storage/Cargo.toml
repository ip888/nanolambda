[package]
name = "nanolambda-storage"
version = "0.1.0"
edition = "2024"
description = "Function registry and storage"

[dependencies]
# Database
rusqlite = { workspace = true }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Hashing
sha2 = { workspace = true }
rand = "0.8"
hex = "0.4"
hmac = "0.12"

# Time
chrono = { workspace = true }

# Payment processing (mock for now - replace with real Stripe SDK)
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }

# Email notifications
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"] }

# UUID
uuid = { workspace = true }

# Logging
tracing = { workspace = true }
