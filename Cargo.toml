[package]
name = "nanolambda"
version = "0.1.0"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
description = "Self-hosted serverless platform with microVM isolation"
repository = "https://github.com/yourusername/nanolambda"
keywords = ["serverless", "lambda", "kvm", "microvm", "functions"]
categories = ["virtualization", "web-programming"]

[workspace]
members = [
    "crates/api-server",
    "crates/runtime",
    "crates/scheduler",
    "crates/storage",
    "benchmarks",
]

# Centralized dependency versions for consistency across workspace
[workspace.dependencies]
# Async runtime
tokio = { version = "1.45", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web framework
axum = "0.8"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }

# Hashing
sha2 = "0.10"
blake3 = "1.5"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Async traits
async-trait = "0.1"

[[bin]]
name = "nanolambda-server"
path = "src/bin/server.rs"

[[bin]]
name = "nanolambda-cli"
path = "src/bin/cli.rs"

[dependencies]
# Use workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }

# Additional dependencies
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }

# Workspace crates
nanolambda-api = { path = "crates/api-server" }
nanolambda-runtime = { path = "crates/runtime" }
nanolambda-scheduler = { path = "crates/scheduler" }
nanolambda-storage = { path = "crates/storage" }

[dev-dependencies]
tempfile = "3.12"
mockall = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
