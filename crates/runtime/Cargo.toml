[package]
name = "nanolambda-runtime"
version = "0.1.0"
edition = "2024"
description = "Language runtime management"

[dependencies]
# Async runtime
tokio = { workspace = true }
async-trait = "0.1"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Base64 encoding
base64 = "0.22"

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Hashing (upgrade from md5 to blake3 for better performance)
blake3 = { workspace = true }

# System calls for resource limits (Unix-only)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
