<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NanoLambda Real-time Monitoring Dashboard">
    <meta name="theme-color" content="#0f172a">
    <title>NanoLambda Monitoring</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>⚡</text></svg>">
    
    <!-- External Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    
    <!-- Modular CSS -->
    <link rel="stylesheet" href="/dashboard/css/variables.css">
    <link rel="stylesheet" href="/dashboard/css/layout.css">
    <link rel="stylesheet" href="/dashboard/css/components.css">
    <link rel="stylesheet" href="/dashboard/css/animations.css">
</head>
<body>
    <div class="dashboard">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-brand" title="NanoLambda">
                <i class="fas fa-bolt"></i>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" title="Dashboard">
                    <i class="fas fa-chart-line"></i>
                </button>
                <button class="nav-item disabled" title="Settings (Coming Soon)" disabled>
                    <i class="fas fa-cog"></i>
                </button>
                <button class="nav-item disabled" title="Documentation (Coming Soon)" disabled>
                    <i class="fas fa-book"></i>
                </button>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main">
            <!-- HEADER -->
            <header class="header">
                <div class="header-top">
                    <div>
                        <h1 class="header-title">Dashboard</h1>
                        <p class="header-subtitle">Real-time serverless function metrics</p>
                    </div>
                    <div class="header-controls">
                        <div class="last-update" id="lastUpdate">
                            <i class="fas fa-clock"></i>
                            <span>Updated: <span id="lastUpdateTime">Never</span></span>
                        </div>
                        <div class="status-badge" id="statusBadge">
                            <div class="status-dot"></div>
                            <span id="statusText">Live</span>
                        </div>
                        <button class="btn btn-primary" id="globalRefresh" data-tooltip="Force refresh all data">
                            <i class="fas fa-sync-alt"></i>
                            Refresh
                        </button>
                    </div>
                </div>
            </header>

            <!-- ERROR STATE -->
            <div id="errorContainer" style="display:none;">
                <div class="error">
                    <div class="error-content">
                        <i class="fas fa-exclamation-circle"></i>
                        <span id="errorText">Failed to load metrics</span>
                    </div>
                    <button class="retry-btn" id="retryBtn">
                        <i class="fas fa-redo"></i> Retry
                    </button>
                </div>
            </div>

            <!-- METRICS SECTION -->
            <section class="metrics-container" id="metricsContainer">
                <!-- Generated by JavaScript -->
            </section>

            <!-- CHARTS SECTION -->
            <section class="charts-grid" id="chartsContainer">
                <!-- Generated by JavaScript -->
            </section>

            <!-- INFO SECTION -->
            <section class="info-grid" id="infoContainer">
                <!-- Generated by JavaScript -->
            </section>
        </main>
    </div>

    <!-- Modular JavaScript (ES6 Modules) -->
    <script type="module" src="/dashboard/js/app.js"></script>
</body>
</html>
