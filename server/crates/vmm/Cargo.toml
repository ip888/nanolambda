[package]
name = "nanolambda-vmm"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "MicroVM management with KVM for secure function isolation"
license = "MIT"

[lints]
workspace = true

# =============================================================================
# BUSINESS DECISION: Why a Custom VMM?
#
# 1. AWS Firecracker is excellent but complex for self-hosted deployments
# 2. Direct KVM control enables cold start optimizations (snapshot/restore)
# 3. Minimalist approach: only features needed for serverless (no PCI, no ACPI)
# 4. Learning/educational value for the platform
#
# Alternatives Considered:
# - cloud-hypervisor: Too many features, large binary
# - firecracker: Separate process, harder to integrate
# - kvm-ioctls crate: Used as reference, but we want zero external VMM deps
# =============================================================================

[dependencies]
# Logging
tracing = "0.1"

# Error handling
thiserror = "2.0"

# Serialization for snapshots
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hex encoding for content hashes
hex = "0.4"

# System calls (Unix only)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# None - keep dev dependencies minimal

[features]
default = []
# Enable detailed KVM debugging output
debug-kvm = []
