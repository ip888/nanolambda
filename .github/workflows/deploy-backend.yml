name: Deploy Backend to DigitalOcean

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nanolambda-server

jobs:
  # ---------------------------------------------------------------------------
  # Pre-deploy gate — fast checks that catch build/format/test failures before
  # we spend 5+ minutes on a Docker image build.
  # ---------------------------------------------------------------------------
  pre-deploy:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-predeploy-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-predeploy-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --lib

      - name: Verify Dockerfile parses
        run: docker build --check . 2>/dev/null || echo "docker build --check not supported, skipping"

      - name: Scan for secrets in diff
        run: |
          if git diff HEAD~1..HEAD -U0 2>/dev/null | grep -iqE '(sk-[a-z0-9]{20,}|AKIA[A-Z0-9]{16}|ghp_[a-zA-Z0-9]{36}|-----BEGIN (RSA |EC )?PRIVATE KEY)'; then
            echo "::error::Possible secret detected in diff"
            exit 1
          fi
          echo "No secrets detected"

  # ---------------------------------------------------------------------------
  # Build and deploy — only runs after pre-deploy passes.
  # ---------------------------------------------------------------------------
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [pre-deploy]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image binaries
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ls -la /usr/local/bin/nanolambda-server /usr/local/bin/nanolambda-mcp
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest python3 --version

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Stop and remove old container
            docker stop nanolambda-server || true
            docker rm nanolambda-server || true

            # Run new container with production env vars
            docker run -d \
              --name nanolambda-server \
              --restart unless-stopped \
              -p 8080:8080 \
              -v /var/lib/nanolambda:/data \
              -v /tmp/nanolambda/sandbox:/tmp/nanolambda/sandbox \
              --env-file /var/lib/nanolambda/.env \
              -e DATABASE_PATH=/data/nanolambda.db \
              -e RUST_LOG=info,nanolambda=debug \
              -e CORS_ALLOWED_ORIGINS=https://nanolambda.io,https://api.nanolambda.io \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Clean up old images
            docker image prune -af

      - name: Post-deploy health check
        run: |
          echo "Waiting for container startup..."
          for i in $(seq 1 20); do
            if curl -sf http://${{ secrets.DO_HOST }}:8080/health >/dev/null 2>&1; then
              echo "Health check passed on attempt $i"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "::error::Health check failed after 20 attempts"
              exit 1
            fi
            sleep 3
          done

          echo ""
          echo "Verifying Prometheus metrics endpoint..."
          curl -sf http://${{ secrets.DO_HOST }}:8080/metrics/prometheus | head -5
          echo ""
          echo "Deployment verified successfully."
