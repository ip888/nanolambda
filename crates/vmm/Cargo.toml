[package]
name = "nanolambda-vmm"
version = "0.1.0"
edition = "2021"
description = "MicroVM manager using KVM"

[dependencies]
# KVM bindings
kvm-ioctls = "0.17"
kvm-bindings = "0.8"

# Memory management
vm-memory = { version = "0.14", features = ["backend-mmap"] }

# Virtio devices
virtio-bindings = "0.2"

# Async
tokio = { version = "1.40", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

# Serialization (for snapshots)
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# System calls
libc = "0.2"
nix = { version = "0.29", features = ["process", "signal", "mman"] }

[dev-dependencies]
tempfile = "3.12"
