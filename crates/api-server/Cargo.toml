[package]
name = "nanolambda-api"
version = "0.1.0"
edition = "2024"
description = "Lambda-compatible REST API server"

[dependencies]
# Web framework
axum = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }

# Async runtime
tokio = { workspace = true }

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Time
chrono = { workspace = true }

# UUID generation
uuid = { version = "1.6", features = ["v4"] }

# Workspace crates
nanolambda-runtime = { path = "../runtime" }
nanolambda-storage = { path = "../storage" }

[dev-dependencies]
tower = "0.5"
futures = "0.3"
tokio-test = "0.4"
