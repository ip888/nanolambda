[package]
name = "nanolambda-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
authors = ["NanoLambda Team"]
license = "MIT"
description = "Self-hosted serverless platform with microVM isolation - Traditional Server"
repository = "https://github.com/ip888/nanolambda"
keywords = ["serverless", "lambda", "kvm", "microvm", "functions"]
categories = ["virtualization", "web-programming"]

[workspace]
members = [
    "crates/api-server",
    "crates/mcp",
    "crates/runtime",
    "crates/storage",
    "benchmarks",
]

# Centralized dependency versions for consistency across workspace
[workspace.dependencies]
# Async runtime - only features actually used
tokio = { version = "1.50", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "macros",
    "signal",
    "fs",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web framework
axum = "0.8"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Database - rusqlite pinned to 0.32 for sqlx 0.8 compatibility (libsqlite3-sys conflict)
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }

# Hashing
sha2 = "0.10"
blake3 = "1.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.23", features = ["v4", "serde"] }

# =============================================================================
# Workspace Lint Configuration (Rust 2024 best practice)
# All member crates inherit these via [lints] workspace = true
# =============================================================================
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Enable pedantic lints for production quality
pedantic = { level = "warn", priority = -1 }

# --- Allowed exceptions (with justification) ---
# Documentation style - we use natural language
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Module organization preferences
module_name_repetitions = "allow"
wildcard_imports = "allow"

# Must-use is too verbose for builder patterns
must_use_candidate = "allow"
return_self_not_must_use = "allow"

# Casting precision - necessary for metric calculations
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

# Style preferences - non-critical
items_after_statements = "allow"
redundant_closure_for_method_calls = "allow"
manual_let_else = "allow"
uninlined_format_args = "allow"
map_unwrap_or = "allow"
needless_pass_by_value = "allow"
used_underscore_binding = "allow"
unused_self = "allow"
too_many_lines = "allow"
similar_names = "allow"
if_not_else = "allow"
match_same_arms = "allow"

# Async/sync patterns — many constructors are async for future-proofing
unused_async = "allow"

# Match patterns — existing code uses match for clarity
single_match_else = "allow"

# Struct naming — domain structs use descriptive field names
struct_field_names = "allow"
struct_excessive_bools = "allow"

# Lifetime patterns — explicit lifetimes can improve clarity
needless_lifetimes = "allow"

# Cast patterns — needed for DB/metric type conversions
cast_lossless = "allow"

# Default trait — many types have custom initialization logic
new_without_default = "allow"

# Large types on stack — acceptable for config/response structs
large_futures = "allow"

# Enum patterns
enum_glob_use = "allow"

# Style — existing codebase patterns, safe to allow
needless_raw_string_hashes = "allow"
bool_to_int_with_if = "allow"
borrow_as_ptr = "allow"
unnecessary_wraps = "allow"
match_wildcard_for_single_variants = "allow"
assigning_clones = "allow"
explicit_iter_loop = "allow"
single_char_pattern = "allow"
implicit_clone = "allow"
trivially_copy_pass_by_ref = "allow"
unreadable_literal = "allow"
option_if_let_else = "allow"
no_effect_underscore_binding = "allow"
redundant_else = "allow"
implicit_hasher = "allow"
ignored_unit_patterns = "allow"
case_sensitive_file_extension_comparisons = "allow"

[[bin]]
name = "nanolambda-server"
path = "src/bin/server.rs"

[[bin]]
name = "nanolambda-cli"
path = "src/bin/cli.rs"

[dependencies]
# Use workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }

# Additional dependencies
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }

# Workspace crates
nanolambda-api = { path = "crates/api-server" }
nanolambda-runtime = { path = "crates/runtime" }
nanolambda-storage = { path = "crates/storage" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.12"
mockall = "0.14.0"

# =============================================================================
# Build Profiles - Optimized for both development speed and production quality
# =============================================================================

[profile.release]
# Maximum optimization for production
opt-level = 3
lto = true        # Link-Time Optimization for smaller, faster binaries
codegen-units = 1 # Single codegen unit for best optimization
strip = true      # Strip debug symbols for smaller binaries
panic = "abort"   # Abort on panic (smaller binary, no unwinding)

[profile.dev]
# Fast compile times for development
opt-level = 0      # No optimization for fast builds
debug = 1          # Reduced debug info (1 = line tables only, faster than 2)
incremental = true # Incremental compilation (default but explicit)

[profile.dev.package."*"]
# Optimize dependencies even in dev mode for faster runtime
# This is a one-time cost that speeds up all subsequent runs
opt-level = 2

[profile.test]
# Faster test compilation with some optimization
opt-level = 1
debug = 1
incremental = true

# CI/quick release build - faster than full release, still optimized
[profile.release-fast]
inherits = "release"
lto = "thin"         # Thin LTO - faster compile, nearly as good
codegen-units = 4    # More parallelism

# Minimum size release - for constrained environments
[profile.release-small]
inherits = "release"
opt-level = "z"      # Optimize for size
lto = true
codegen-units = 1
strip = true
panic = "abort"
