[package]
name = "nanolambda-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Lambda-compatible REST API server"

[lints]
workspace = true

[dependencies]
# Web framework
axum = { workspace = true, features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "timeout"] }

# Async runtime
tokio = { workspace = true }
tokio-stream = "0.1"

# Async utilities
futures = "0.3"

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Time
chrono = { workspace = true }

# UUID generation
uuid = { version = "1.6", features = ["v4"] }

# Workspace crates
nanolambda-runtime = { path = "../runtime" }
nanolambda-storage = { path = "../storage" }

[dev-dependencies]
tower = "0.5"
tokio-test = "0.4"
reqwest = { version = "0.13", features = ["json"] }
