[package]
name = "nanolambda-vmm"
version = "0.1.0"
edition = "2024"
description = "MicroVM manager using KVM"

[dependencies]
# KVM bindings
kvm-ioctls = "0.24.0"
kvm-bindings = "0.14.0"

# Memory management
vm-memory = { version = "0.16", features = ["backend-mmap"] }
vm-device = "0.1"  # Added for better device management
vm-superio = "0.8.1" # Added for console support

# Virtio devices
virtio-bindings = "0.2"
versionize = "0.2" # Added for state serialization
versionize_derive = "0.1"

# Async
tokio = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization (for snapshots)
serde = { workspace = true }
serde_json = { workspace = true }
bincode = "2.0"

# System calls
libc = "0.2"
nix = { version = "0.30", features = ["process", "signal", "mman", "sched"] }

# Security features
seccompiler = "0.5"
caps = "0.5"
landlock = "0.4"
selinux = "0.5"

# Added for better Linux boot support
linux-loader = { version = "0.13.1", features = ["elf"] }

[dev-dependencies]
tempfile = "3.12"
