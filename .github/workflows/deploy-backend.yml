name: Deploy to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Pre-deploy gate — catch failures before spending time on Docker build.
  # ---------------------------------------------------------------------------
  pre-deploy:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-cargo-predeploy-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-predeploy-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --lib

      - name: Scan for secrets in diff
        run: |
          if git diff HEAD~1..HEAD -U0 2>/dev/null | grep -iqE '(sk-[a-z0-9]{20,}|AKIA[A-Z0-9]{16}|ghp_[a-zA-Z0-9]{36}|-----BEGIN (RSA |EC )?PRIVATE KEY)'; then
            echo "::error::Possible secret detected in diff"
            exit 1
          fi
          echo "No secrets detected"

  # ---------------------------------------------------------------------------
  # Deploy to Fly.io — builds Docker image remotely and deploys.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [pre-deploy]

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        working-directory: ./server
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment
        run: |
          sleep 10
          flyctl status --app nanolambda
          echo ""
          echo "Health check:"
          curl -sf https://nanolambda.fly.dev/health || echo "::warning::Health check failed — app may still be starting"
          echo ""
          echo "Prometheus metrics:"
          curl -sf https://nanolambda.fly.dev/metrics/prometheus | head -5 || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
