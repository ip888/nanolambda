[package]
name = "nanolambda-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Function registry and storage"

[lints]
workspace = true

[dependencies]
# Database - r2d2_sqlite pinned to 0.25 for rusqlite 0.32 compatibility
rusqlite = { workspace = true }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Hashing
sha2 = { workspace = true }
argon2 = "0.5"
getrandom = "0.3"
rand = "0.9"
hex = "0.4"
hmac = "0.12"
base64 = "0.22"

# Time
chrono = { workspace = true }

# Payment processing (mock for now - replace with real Stripe SDK)
reqwest = { workspace = true }

# Email notifications
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-native-tls", "smtp-transport", "builder"] }

# UUID
uuid = { workspace = true }

# Logging
tracing = { workspace = true }
