[package]
name = "nanolambda-api"
version = "0.1.0"
edition = "2021"
description = "Lambda-compatible REST API server"

[dependencies]
actix-web = "4.8"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
