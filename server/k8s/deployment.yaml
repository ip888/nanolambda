# =============================================================================
# NanoLambda Server - Kubernetes Deployment
# =============================================================================
#
# Deploy: kubectl apply -f k8s/
# Scale:  kubectl scale deployment nanolambda-server --replicas=3
#
# Requirements:
# - Kubernetes 1.25+
# - Persistent Volume provisioner (for SQLite storage)
# - Optional: KVM device plugin for MicroVM support
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: nanolambda
  labels:
    app.kubernetes.io/name: nanolambda
    app.kubernetes.io/component: serverless-platform
---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nanolambda-config
  namespace: nanolambda
data:
  RUST_LOG: "info,nanolambda=debug"
  PORT: "8080"
  METRICS_PORT: "9090"
  # Function execution settings
  MAX_CONCURRENT_EXECUTIONS: "100"
  DEFAULT_TIMEOUT_MS: "30000"
  MAX_MEMORY_MB: "512"
---
# Secret for sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: nanolambda-secrets
  namespace: nanolambda
type: Opaque
stringData:
  # Generate with: openssl rand -base64 32
  JWT_SECRET: "change-me-in-production-generate-secure-key"
  # Admin API key for management operations
  ADMIN_API_KEY: "change-me-admin-key"
---
# PersistentVolumeClaim for SQLite database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanolambda-data
  namespace: nanolambda
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard # Adjust based on your cluster
---
# Main Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanolambda-server
  namespace: nanolambda
  labels:
    app.kubernetes.io/name: nanolambda
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nanolambda
      app.kubernetes.io/component: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanolambda
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: nanolambda
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: server
          image: ghcr.io/ip888/nanolambda/server:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          envFrom:
            - configMapRef:
                name: nanolambda-config
            - secretRef:
                name: nanolambda-secrets

          env:
            - name: NANOLAMBDA_DB_PATH
              value: "/data/nanolambda.db"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          volumeMounts:
            - name: data
              mountPath: /data
            - name: functions
              mountPath: /app/functions

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nanolambda-data
        - name: functions
          emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nanolambda
                topologyKey: kubernetes.io/hostname
---
# Service for internal cluster access
apiVersion: v1
kind: Service
metadata:
  name: nanolambda-server
  namespace: nanolambda
  labels:
    app.kubernetes.io/name: nanolambda
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: nanolambda
    app.kubernetes.io/component: server
---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nanolambda-ingress
  namespace: nanolambda
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  tls:
    - hosts:
        - api.nanolambda.io
      secretName: nanolambda-tls
  rules:
    - host: api.nanolambda.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nanolambda-server
                port:
                  name: http
---
# ServiceAccount for RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nanolambda
  namespace: nanolambda
---
# HorizontalPodAutoscaler for auto-scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nanolambda-hpa
  namespace: nanolambda
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nanolambda-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
# PodDisruptionBudget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nanolambda-pdb
  namespace: nanolambda
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nanolambda
      app.kubernetes.io/component: server
