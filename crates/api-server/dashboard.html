<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoLambda Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            margin-bottom: 40px;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 20px;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 16px;
        }
        
        .last-update {
            float: right;
            color: #64748b;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .time-windows {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .time-window {
            padding: 8px 16px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        
        .time-window:hover {
            background: #334155;
        }
        
        .time-window.active {
            background: #3b82f6;
            border-color: #3b82f6;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
        }
        
        .metric-label {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .metric-value {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
        }
        
        .metric-unit {
            font-size: 18px;
            color: #64748b;
            margin-left: 4px;
        }
        
        .metric-secondary {
            font-size: 14px;
            color: #64748b;
            margin-top: 8px;
        }
        
        .status-good { color: #10b981; }
        .status-warning { color: #f59e0b; }
        .status-error { color: #ef4444; }
        
        .latency-breakdown {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .latency-breakdown h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-container {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            height: 300px;
        }
        
        .chart-container h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #fff;
        }
        
        .chart-wrapper {
            position: relative;
            height: 240px;
        }
        
        .percentile-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .percentile-label {
            width: 60px;
            font-size: 14px;
            color: #94a3b8;
        }
        
        .percentile-bar {
            flex: 1;
            height: 24px;
            background: #0f172a;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        
        .percentile-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            transition: width 0.3s;
        }
        
        .percentile-value {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }
        
        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 18px;
        }
        
        .refresh-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
            margin-left: 8px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* Responsive Design - Mobile First */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .subtitle {
                font-size: 14px;
            }
            
            .last-update {
                float: none;
                margin-top: 10px;
                font-size: 12px;
            }
            
            .time-windows {
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .time-window {
                padding: 6px 12px;
                font-size: 14px;
            }
            
            .metrics-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .charts-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .chart-container {
                height: auto;
                min-height: 280px;
            }
            
            .chart-wrapper {
                height: 220px;
            }
            
            .metric-value {
                font-size: 28px;
            }
        }
        
        @media (min-width: 769px) and (max-width: 1024px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
            
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (min-width: 1025px) {
            .charts-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ NanoLambda Dashboard</h1>
            <p class="subtitle">Real-time serverless function metrics</p>
            <div class="last-update">
                Last updated: <span id="lastUpdate">--</span>
                <span class="refresh-indicator"></span>
            </div>
        </header>
        
        <div class="time-windows">
            <button class="time-window active" data-window="last_hour">Last Hour</button>
            <button class="time-window" data-window="last_24h">Last 24 Hours</button>
            <button class="time-window" data-window="all_time">All Time</button>
        </div>
        
        <!-- API Key Input for Usage Tracking -->
        <div class="api-key-section" style="margin: 20px 0; padding: 15px; background: #1e293b; border-radius: 8px; border: 1px solid #334155;">
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <label style="color: #94a3b8; font-size: 14px;">🔑 API Key (optional):</label>
                <input type="text" id="apiKeyInput" placeholder="nl_..." autocomplete="off"
                    style="flex: 1; min-width: 300px; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; font-family: 'Courier New', monospace; font-size: 13px;">
                <button id="toggleApiKeyBtn" onclick="toggleApiKeyVisibility()" 
                    style="padding: 8px 12px; background: #334155; color: #94a3b8; border: none; border-radius: 4px; cursor: pointer;" title="Toggle visibility">
                    👁️
                </button>
                <button id="loadUsageBtn" onclick="fetchUsageData()" 
                    style="padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500;">
                    Load Usage & Billing
                </button>
                <button id="clearApiKeyBtn" onclick="clearApiKey()" 
                    style="padding: 8px 16px; background: #64748b; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Clear
                </button>
            </div>
            <div id="usageError" style="margin-top: 8px; color: #ef4444; font-size: 13px; display: none;"></div>
        </div>
        
        <!-- Usage & Billing Section -->
        <div id="usageSection" style="display: none; margin-bottom: 30px;">
            <h2 style="color: #e2e8f0; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
                💳 Usage & Billing
            </h2>
            <div id="usageContent"></div>
        </div>
        
        <div id="dashboard-content">
            <div class="no-data">Loading metrics...</div>
        </div>
    </div>
    
    <script>
        let currentWindow = 'last_hour';
        let charts = {};
        
        // Initialize charts
        function initCharts() {
            const chartOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: { color: '#e2e8f0' }
                    }
                },
                scales: {
                    x: { 
                        ticks: { color: '#94a3b8' },
                        grid: { color: '#334155' }
                    },
                    y: { 
                        ticks: { color: '#94a3b8' },
                        grid: { color: '#334155' }
                    }
                }
            };
            
            // Invocations timeline (line chart)
            charts.invocations = new Chart(
                document.getElementById('invocationsChart'),
                {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'Invocations',
                            data: [],
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: chartOptions
                }
            );
            
            // Latency percentiles (bar chart)
            charts.latency = new Chart(
                document.getElementById('latencyChart'),
                {
                    type: 'bar',
                    data: {
                        labels: ['P50', 'P95', 'P99', 'Average'],
                        datasets: [{
                            label: 'Latency (ms)',
                            data: [0, 0, 0, 0],
                            backgroundColor: [
                                'rgba(16, 185, 129, 0.8)',
                                'rgba(245, 158, 11, 0.8)',
                                'rgba(239, 68, 68, 0.8)',
                                'rgba(59, 130, 246, 0.8)'
                            ],
                            borderColor: [
                                '#10b981',
                                '#f59e0b',
                                '#ef4444',
                                '#3b82f6'
                            ],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        ...chartOptions,
                        plugins: {
                            legend: { display: false }
                        }
                    }
                }
            );
            
            // Status distribution (doughnut chart)
            charts.status = new Chart(
                document.getElementById('statusChart'),
                {
                    type: 'doughnut',
                    data: {
                        labels: ['Success', 'Errors', 'Timeouts'],
                        datasets: [{
                            data: [0, 0, 0],
                            backgroundColor: [
                                'rgba(16, 185, 129, 0.8)',
                                'rgba(239, 68, 68, 0.8)',
                                'rgba(245, 158, 11, 0.8)'
                            ],
                            borderColor: [
                                '#10b981',
                                '#ef4444',
                                '#f59e0b'
                            ],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { color: '#e2e8f0' }
                            }
                        }
                    }
                }
            );
            
            // Cold start percentage (doughnut gauge)
            charts.coldStart = new Chart(
                document.getElementById('coldStartChart'),
                {
                    type: 'doughnut',
                    data: {
                        labels: ['Cold Starts', 'Warm Starts'],
                        datasets: [{
                            data: [0, 100],
                            backgroundColor: [
                                'rgba(139, 92, 246, 0.8)',
                                'rgba(51, 65, 85, 0.3)'
                            ],
                            borderColor: [
                                '#8b5cf6',
                                '#334155'
                            ],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        circumference: 180,
                        rotation: -90,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { color: '#e2e8f0' }
                            }
                        }
                    }
                }
            );
        }
        
        function updateCharts(metrics) {
            // Update invocations timeline (show last 20 data points)
            const invocationsData = generateTimelineData(metrics);
            charts.invocations.data.labels = invocationsData.labels;
            charts.invocations.data.datasets[0].data = invocationsData.values;
            charts.invocations.update();
            
            // Update latency chart
            charts.latency.data.datasets[0].data = [
                metrics.p50_latency_ms || 0,
                metrics.p95_latency_ms || 0,
                metrics.p99_latency_ms || 0,
                metrics.avg_latency_ms || 0
            ];
            charts.latency.update();
            
            // Update status distribution
            const successCount = metrics.total_invocations - metrics.errors - metrics.timeouts;
            charts.status.data.datasets[0].data = [
                successCount,
                metrics.errors || 0,
                metrics.timeouts || 0
            ];
            charts.status.update();
            
            // Update cold start gauge
            const coldStartRate = metrics.cold_start_rate || 0;
            charts.coldStart.data.datasets[0].data = [
                coldStartRate * 100,
                (1 - coldStartRate) * 100
            ];
            charts.coldStart.update();
        }
        
        function generateTimelineData(metrics) {
            // Generate sample timeline data (in production, this would come from time-series data)
            const points = 20;
            const labels = [];
            const values = [];
            const now = Date.now();
            const interval = currentWindow === 'last_hour' ? 3 * 60 * 1000 : 
                           currentWindow === 'last_24h' ? 72 * 60 * 1000 : 
                           24 * 60 * 60 * 1000;
            
            for (let i = points - 1; i >= 0; i--) {
                const time = new Date(now - (i * interval));
                labels.push(time.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                }));
                // Approximate distribution (in production, use actual time-series data)
                values.push(Math.max(0, Math.floor(metrics.total_invocations / points + (Math.random() - 0.5) * 10)));
            }
            
            return { labels, values };
        }

        
        // Fetch and display metrics
        async function fetchMetrics() {
            try {
                const response = await fetch('/metrics');
                const data = await response.json();
                
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
                renderMetrics(data[currentWindow]);
            } catch (error) {
                console.error('Failed to fetch metrics:', error);
                document.getElementById('dashboard-content').innerHTML = 
                    '<div class="no-data">Failed to load metrics. Is the server running?</div>';
            }
        }
        
        // Render metrics UI
        function renderMetrics(metrics) {
            if (metrics.total_invocations === 0) {
                document.getElementById('dashboard-content').innerHTML = 
                    '<div class="no-data">No invocations yet. Create and invoke a function to see metrics!</div>';
                return;
            }
            
            const html = `
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">Total Invocations</div>
                        <div class="metric-value">${metrics.total_invocations.toLocaleString()}</div>
                        <div class="metric-secondary">
                            ${metrics.invocations_per_second.toFixed(2)} invocations/sec
                        </div>
                    </div>
                    
                    <div class="metric-card">
                        <div class="metric-label">Average Latency</div>
                        <div class="metric-value">
                            ${metrics.avg_latency_ms.toFixed(1)}
                            <span class="metric-unit">ms</span>
                        </div>
                        <div class="metric-secondary ${getLatencyClass(metrics.avg_latency_ms)}">
                            ${getLatencyText(metrics.avg_latency_ms)}
                        </div>
                    </div>
                    
                    <div class="metric-card">
                        <div class="metric-label">Cold Starts</div>
                        <div class="metric-value">
                            ${metrics.cold_starts}
                            <span class="metric-unit">(${(metrics.cold_start_rate * 100).toFixed(1)}%)</span>
                        </div>
                        <div class="metric-secondary ${getColdStartClass(metrics.cold_start_rate)}">
                            ${getColdStartText(metrics.cold_start_rate)}
                        </div>
                    </div>
                    
                    <div class="metric-card">
                        <div class="metric-label">Error Rate</div>
                        <div class="metric-value ${getErrorClass(metrics.error_rate)}">
                            ${(metrics.error_rate * 100).toFixed(1)}
                            <span class="metric-unit">%</span>
                        </div>
                        <div class="metric-secondary">
                            ${metrics.errors} errors / ${metrics.timeouts} timeouts
                        </div>
                    </div>
                </div>
                
                <div class="charts-grid">
                    <div class="chart-container">
                        <h2>📈 Invocations Over Time</h2>
                        <div class="chart-wrapper">
                            <canvas id="invocationsChart"></canvas>
                        </div>
                    </div>
                    
                    <div class="chart-container">
                        <h2>⚡ Latency Distribution</h2>
                        <div class="chart-wrapper">
                            <canvas id="latencyChart"></canvas>
                        </div>
                    </div>
                    
                    <div class="chart-container">
                        <h2>🎯 Success vs Errors</h2>
                        <div class="chart-wrapper">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                    
                    <div class="chart-container">
                        <h2>🔥 Cold Start Rate</h2>
                        <div class="chart-wrapper">
                            <canvas id="coldStartChart"></canvas>
                        </div>
                    </div>
                </div>
                
                <div class="latency-breakdown">
                    <h2>📊 Latency Distribution</h2>
                    
                    <div class="percentile-row">
                        <div class="percentile-label">P50</div>
                        <div class="percentile-bar">
                            <div class="percentile-fill" style="width: ${getPercentileWidth(metrics.p50_latency_ms, metrics.p99_latency_ms)}%"></div>
                            <div class="percentile-value">${metrics.p50_latency_ms}ms</div>
                        </div>
                    </div>
                    
                    <div class="percentile-row">
                        <div class="percentile-label">P95</div>
                        <div class="percentile-bar">
                            <div class="percentile-fill" style="width: ${getPercentileWidth(metrics.p95_latency_ms, metrics.p99_latency_ms)}%"></div>
                            <div class="percentile-value">${metrics.p95_latency_ms}ms</div>
                        </div>
                    </div>
                    
                    <div class="percentile-row">
                        <div class="percentile-label">P99</div>
                        <div class="percentile-bar">
                            <div class="percentile-fill" style="width: 100%"></div>
                            <div class="percentile-value">${metrics.p99_latency_ms}ms</div>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('dashboard-content').innerHTML = html;
            
            // Always reinitialize charts after innerHTML (canvas elements are destroyed)
            initCharts();
            
            // Update charts with new data
            updateCharts(metrics);
        }
        
        // Helper functions
        function getLatencyClass(latency) {
            if (latency < 100) return 'status-good';
            if (latency < 500) return 'status-warning';
            return 'status-error';
        }
        
        function getLatencyText(latency) {
            if (latency < 100) return '⚡ Excellent';
            if (latency < 500) return '⚠️ Acceptable';
            return '❌ Slow';
        }
        
        function getColdStartClass(rate) {
            if (rate < 0.1) return 'status-good';
            if (rate < 0.5) return 'status-warning';
            return 'status-error';
        }
        
        function getColdStartText(rate) {
            if (rate < 0.1) return '✅ Very low';
            if (rate < 0.5) return '⚠️ Moderate';
            return '❌ High';
        }
        
        function getErrorClass(rate) {
            if (rate < 0.01) return 'status-good';
            if (rate < 0.05) return 'status-warning';
            return 'status-error';
        }
        
        function getPercentileWidth(value, max) {
            if (max === 0) return 0;
            return Math.min(100, (value / max) * 100);
        }
        
        // Usage & Billing Functions
        async function fetchUsageData() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const errorEl = document.getElementById('usageError');
            const usageSection = document.getElementById('usageSection');
            const usageContent = document.getElementById('usageContent');
            
            if (!apiKey) {
                errorEl.textContent = 'Please enter an API key';
                errorEl.style.display = 'block';
                return;
            }
            
            errorEl.style.display = 'none';
            usageContent.innerHTML = '<div style="padding: 20px; text-align: center; color: #94a3b8;">Loading...</div>';
            usageSection.style.display = 'block';
            
            try {
                // Fetch usage stats, billing info, and rate limit status in parallel
                const [usageRes, billingRes, rateLimitRes] = await Promise.all([
                    fetch('/usage/stats', {
                        headers: { 'Authorization': `Bearer ${apiKey}` }
                    }),
                    fetch('/usage/billing', {
                        headers: { 'Authorization': `Bearer ${apiKey}` }
                    }),
                    fetch('/rate-limit/status', {
                        headers: { 'Authorization': `Bearer ${apiKey}` }
                    })
                ]);
                
                if (!usageRes.ok || !billingRes.ok || !rateLimitRes.ok) {
                    throw new Error('Invalid API key or unauthorized');
                }
                
                const usage = await usageRes.json();
                const billing = await billingRes.json();
                const rateLimit = await rateLimitRes.json();
                
                renderUsageData(usage, billing, rateLimit);
                
                // Store API key for future use
                sessionStorage.setItem('nanolambda_api_key', apiKey);
            } catch (error) {
                errorEl.textContent = `Error: ${error.message}`;
                errorEl.style.display = 'block';
                usageSection.style.display = 'none';
            }
        }
        
        function renderUsageData(usage, billing, rateLimit) {
            const hasUsage = usage.total_invocations > 0;
            
            const html = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px;">
                    <!-- Rate Limit Card -->
                    <div class="metric-card" style="background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);">
                        <div class="metric-label">🎯 Rate Limit Tier</div>
                        <div class="metric-value" style="text-transform: uppercase; font-size: 1.8rem;">
                            ${rateLimit.tier}
                        </div>
                        <div class="metric-secondary">
                            ${rateLimit.refill_rate_per_min} 
                            <span style="font-size: 12px; opacity: 0.8;">(burst: ${rateLimit.capacity})</span>
                        </div>
                        <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.2); font-size: 13px;">
                            Available: <strong>${rateLimit.available_tokens}</strong> / ${rateLimit.capacity} tokens
                        </div>
                    </div>
                    
                    <!-- Total Cost Card -->
                    <div class="metric-card" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
                        <div class="metric-label">💰 Total Cost</div>
                        <div class="metric-value">
                            $${hasUsage ? billing.total_cost.toFixed(4) : '0.0000'}
                        </div>
                        <div class="metric-secondary">
                            Invocations: $${hasUsage ? billing.invocation_cost.toFixed(4) : '0.0000'}<br>
                            Memory: $${hasUsage ? billing.memory_cost.toFixed(4) : '0.0000'}
                        </div>
                    </div>
                    
                    <!-- Invocations Card -->
                    <div class="metric-card">
                        <div class="metric-label">📊 Total Invocations</div>
                        <div class="metric-value">
                            ${hasUsage ? (usage.total_invocations || 0).toLocaleString() : '0'}
                        </div>
                        <div class="metric-secondary">
                            ✅ ${hasUsage ? (usage.successful_invocations || 0) : 0} success<br>
                            ❌ ${hasUsage ? (usage.failed_invocations || 0) : 0} failed
                        </div>
                    </div>
                    
                    <!-- Resource Usage Card -->
                    <div class="metric-card">
                        <div class="metric-label">⚡ Resource Usage</div>
                        <div class="metric-value" style="font-size: 1.5rem;">
                            ${hasUsage ? billing.gb_seconds.toFixed(2) : '0.00'}
                            <span class="metric-unit">GB-s</span>
                        </div>
                        <div class="metric-secondary">
                            Execution: ${hasUsage ? (usage.total_execution_time_ms / 1000).toFixed(1) : '0'}s total<br>
                            Cold Starts: ${hasUsage ? usage.cold_starts : 0}
                        </div>
                    </div>
                </div>
                
                ${hasUsage && usage.functions_used && usage.functions_used.length > 0 ? `
                <div style="background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155;">
                    <h3 style="color: #e2e8f0; margin: 0 0 10px 0; font-size: 14px;">📦 Functions Used</h3>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                        ${usage.functions_used.map(fn => `
                            <span style="background: #334155; padding: 4px 12px; border-radius: 4px; font-size: 13px; color: #94a3b8;">
                                ${fn}
                            </span>
                        `).join('')}
                    </div>
                    <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #334155; font-size: 12px; color: #64748b;">
                        Period: ${new Date((usage.first_use || 0) * 1000).toLocaleString()} → ${new Date((usage.last_use || 0) * 1000).toLocaleString()}
                    </div>
                </div>
                ` : `
                <div style="background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; text-align: center; color: #94a3b8;">
                    No usage recorded yet. Start by invoking functions!
                </div>
                `}
                
                <div style="margin-top: 15px; padding: 12px; background: #0f172a; border-radius: 6px; border: 1px solid #1e293b; font-size: 12px; color: #64748b;">
                    <strong style="color: #94a3b8;">Pricing:</strong> $0.16 per 1M invocations + $0.000015 per GB-second<br>
                    <span style="color: #10b981; font-size: 11px;">💰 20% cheaper than AWS Lambda</span>
                </div>
            `;
            
            document.getElementById('usageContent').innerHTML = html;
        }
        
        function clearApiKey() {
            const input = document.getElementById('apiKeyInput');
            const btn = document.getElementById('toggleApiKeyBtn');
            input.value = '';
            input.type = 'text';
            btn.textContent = '👁️';
            document.getElementById('usageSection').style.display = 'none';
            document.getElementById('usageError').style.display = 'none';
            sessionStorage.removeItem('nanolambda_api_key');
            input.focus();
        }
        
        function toggleApiKeyVisibility() {
            const input = document.getElementById('apiKeyInput');
            const btn = document.getElementById('toggleApiKeyBtn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }
        
        // Load API key from session storage if available
        window.addEventListener('DOMContentLoaded', () => {
            const savedApiKey = sessionStorage.getItem('nanolambda_api_key');
            if (savedApiKey) {
                document.getElementById('apiKeyInput').value = savedApiKey;
                fetchUsageData();
            }
            
            // Also check URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const apiKeyParam = urlParams.get('apiKey');
            if (apiKeyParam) {
                document.getElementById('apiKeyInput').value = apiKeyParam;
                fetchUsageData();
            }
        });
        
        // Time window switching
        document.querySelectorAll('.time-window').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.time-window').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentWindow = btn.dataset.window;
                fetchMetrics();
            });
        });
        
        // Auto-refresh every 5 seconds
        fetchMetrics();
        setInterval(fetchMetrics, 5000);
    </script>
</body>
</html>
